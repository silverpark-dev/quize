<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>해커스 VOCA 40문제 퀴즈</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --text:#20242a; --muted:#69717d;
  --line:#dde2e8; --accent:#222; --good:#eaf7ee; --bad:#fff0f0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif}
.app{max-width:760px;margin:28px auto;padding:0 16px 48px}
h1{font-size:25px;margin:0 0 6px}
.desc{font-size:14px;color:var(--muted);margin-bottom:18px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.setup{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
select,button{height:44px;border:1px solid #ccd2d9;border-radius:10px;background:#fff;font-size:15px;padding:0 12px}
select{width:100%}
button{cursor:pointer;font-weight:700}
.primary{background:#20242a;color:#fff;border-color:#20242a;min-width:115px}
.hidden{display:none!important}
.status{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px;font-size:14px}
.progress{height:8px;background:#edf0f3;border-radius:999px;overflow:hidden;margin-bottom:22px}
.progress>div{height:100%;background:#20242a;width:0;transition:width .2s}
.qtype{font-size:12px;color:var(--muted);margin-bottom:8px}
.question{font-size:24px;line-height:1.45;font-weight:800;margin:0 0 22px;word-break:keep-all}
.options{display:grid;gap:10px}
.opt{width:100%;min-height:52px;height:auto;text-align:left;padding:12px 14px;background:white;font-weight:600;line-height:1.4}
.opt:hover{background:#f7f8fa}
.opt.good{background:var(--good);border-color:#85c99b}
.opt.bad{background:var(--bad);border-color:#e9a2a2}
.opt:disabled{cursor:default;color:inherit}
.feedback{min-height:28px;margin:14px 0 0;font-size:14px;font-weight:700}
.next{width:100%;margin-top:12px}
.result{text-align:center;padding:10px 0}
.score{font-size:48px;font-weight:900;margin:8px 0}
.result p{color:var(--muted)}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.wrong{margin-top:22px;text-align:left}
.wrong h3{font-size:16px}
.wrong-item{padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.wrong-item b{font-family:Arial,sans-serif}
@media(max-width:620px){
  .setup{grid-template-columns:1fr}
  .primary{width:100%}
  .question{font-size:21px}
}
</style>
</head>
<body>
<div class="app">
  <h1>해커스 VOCA 퀴즈</h1>
  <div class="desc">과(DAY)를 선택하면 해당 과의 단어 40문제를 풀 수 있어요.</div>

  <section class="panel" id="setupPanel">
    <div class="setup">
      <div>
        <label for="daySel">과 선택</label>
        <select id="daySel"></select>
      </div>
      <div>
        <label for="modeSel">문제 방식</label>
        <select id="modeSel">
          <option value="ko-en">한글 뜻 → 영어 단어</option>
          <option value="en-ko">영어 단어 → 한글 뜻</option>
          <option value="mix" selected>두 방식 섞어서</option>
        </select>
      </div>
      <button class="primary" id="startBtn" type="button">40문제 시작</button>
    </div>
  </section>

  <section class="panel hidden" id="quizPanel">
    <div class="status">
      <span id="progressText">1 / 40</span>
      <span id="scoreText">점수 0</span>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="qtype" id="qtype"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <button class="primary next hidden" id="nextBtn" type="button">다음 문제</button>
  </section>

  <section class="panel hidden" id="resultPanel">
    <div class="result">
      <div>퀴즈 완료</div>
      <div class="score" id="finalScore">0 / 40</div>
      <p id="finalMsg"></p>
      <div class="result-actions">
        <button class="primary" id="againBtn" type="button">같은 과 다시 풀기</button>
        <button id="changeBtn" type="button">다른 과 선택</button>
      </div>
      <div class="wrong hidden" id="wrongBox">
        <h3>틀린 단어 복습</h3>
        <div id="wrongList"></div>
      </div>
    </div>
  </section>
</div>

": "사라지다, 없어지다"}, {"day": "DAY 29", "word": "initial", "meaning": "초기의, 처음의; 머리글자"}, {"day": "DAY 29", "word": "domestic", "meaning": "국내의, 국산의, 가정의, 집안의"}, {"day": "DAY 30", "word": "magazine", "meaning": "잡지"}, {"day": "DAY 30", "word": "article", "meaning": "기사, 글, 조항, 관사"}, {"day": "DAY 30", "word": "press", "meaning": "언론, 신문사; 누르다, 재촉하다"}, {"day": "DAY 30", "word": "advertise", "meaning": "광고하다, 선전하다"}, {"day": "DAY 30", "word": "recent", "meaning": "최근의, 근래의"}, {"day": "DAY 30", "word": "diverse", "meaning": "다양한, 여러 가지의"}, {"day": "DAY 30", "word": "document", "meaning": "문서, 서류, 파일; 기록하다, (서류로) 입증하다"}, {"day": "DAY 30", "word": "expert", "meaning": "전문가, 숙련가"}, {"day": "DAY 30", "word": "explore", "meaning": "탐험하다, 답사하다, 조사하다"}, {"day": "DAY 30", "word": "explode", "meaning": "(폭탄이) 터지다, 폭발하다"}, {"day": "DAY 30", "word": "handle", "meaning": "다루다, 처리하다, 만지다; 손잡이, 자루"}, {"day": "DAY 30", "word": "phrase", "meaning": "문구, 구절, 관용구"}, {"day": "DAY 30", "word": "annoy", "meaning": "짜증 나게 하다"}, {"day": "DAY 30", "word": "obvious", "meaning": "분명한, 확실한"}, {"day": "DAY 30", "word": "mention", "meaning": "언급하다, 말하다"}, {"day": "DAY 30", "word": "entertain", "meaning": "즐겁게 하다, 대접하다"}, {"day": "DAY 30", "word": "detail", "meaning": "세부 사항, 세부 묘사"}, {"day": "DAY 30", "word": "conflict", "meaning": "갈등, 충돌; 상충하다"}, {"day": "DAY 30", "word": "thus", "meaning": "따라서, 이와 같이"}, {"day": "DAY 30", "word": "medium", "meaning": "중간의, 매(개)체, 도구, 수단, 도구"}, {"day": "DAY 30", "word": "depress", "meaning": "우울하게 하다, 낙담시키다"}, {"day": "DAY 30", "word": "demand", "meaning": "요구하다, 필요로 하다; 요구, 청구, 수요"}, {"day": "DAY 30", "word": "identify", "meaning": "확인하다, 알아보다"}, {"day": "DAY 30", "word": "award", "meaning": "상, 상패; 수여하다, 주다"}, {"day": "DAY 30", "word": "regret", "meaning": "후회하다, 유감으로 생각하다; 후회, 유감"}, {"day": "DAY 30", "word": "regard", "meaning": "여기다, 간주하다; 관심, 고려, 존경"}, {"day": "DAY 30", "word": "inquire", "meaning": "질문하다, 알아보다"}, {"day": "DAY 30", "word": "script", "meaning": "대본, 각본"}, {"day": "DAY 30", "word": "decline", "meaning": "쇠퇴, 감소; 감소하다, 쇠퇴하다"}, {"day": "DAY 30", "word": "declare", "meaning": "선언하다, 선포하다"}, {"day": "DAY 30", "word": "deceive", "meaning": "기만하다, 속이다"}, {"day": "DAY 30", "word": "external", "meaning": "외부의, 밖의"}, {"day": "DAY 30", "word": "instantly", "meaning": "즉시, 즉각적으로"}, {"day": "DAY 30", "word": "norm", "meaning": "표준, 기준, 규범"}, {"day": "DAY 30", "word": "analyze", "meaning": "분석하다, 해석하다"}, {"day": "DAY 30", "word": "clarify", "meaning": "명확히 하다, 분명히 말하다"}, {"day": "DAY 30", "word": "defend", "meaning": "지키다, 방어하다, 변호하다"}, {"day": "DAY 30", "word": "reputation", "meaning": "평판, 명성"}, {"day": "DAY 30", "word": "exclude", "meaning": "제외하다, 차단하다"}, {"day": "DAY 30", "word": "net", "meaning": "망, 그물망, (에누리 없는) 순"}];
const byDay = {};
for (const item of VOCAB) (byDay[item.day] ||= []).push(item);

const $ = id => document.getElementById(id);
const daySel=$('daySel'), modeSel=$('modeSel');
Object.keys(byDay).sort().forEach((day,i)=>{
  const op=document.createElement('option');
  op.value=day;
  op.textContent=`${i+1}과 (${day}) · ${byDay[day].length}단어`;
  daySel.appendChild(op);
});
daySel.value='DAY 12';

let quiz=[], index=0, score=0, answered=false, wrong=[];

function shuffle(a){
  const x=[...a];
  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}

function buildQuiz(){
  const day=daySel.value, mode=modeSel.value;
  let source=shuffle(byDay[day]).slice(0,40);
  quiz=source.map((item,i)=>{
    const direction = mode==='mix' ? (Math.random()<0.5?'ko-en':'en-ko') : mode;
    const others=shuffle(byDay[day].filter(x=>x.word!==item.word)).slice(0,3);
    const options=shuffle([item,...others]);
    return {item,direction,options};
  });
  index=0; score=0; wrong=[];
}

function start(){
  buildQuiz();
  $('setupPanel').classList.add('hidden');
  $('resultPanel').classList.add('hidden');
  $('quizPanel').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion(){
  answered=false;
  const q=quiz[index];
  $('progressText').textContent=`${index+1} / ${quiz.length}`;
  $('scoreText').textContent=`점수 ${score}`;
  $('bar').style.width=`${(index/quiz.length)*100}%`;
  $('feedback').textContent='';
  $('nextBtn').classList.add('hidden');
  $('options').innerHTML='';

  if(q.direction==='ko-en'){
    $('qtype').textContent='한글 뜻을 보고 영어 단어를 고르세요.';
    $('question').textContent=q.item.meaning;
  }else{
    $('qtype').textContent='영어 단어의 알맞은 뜻을 고르세요.';
    $('question').textContent=q.item.word;
  }

  q.options.forEach(opt=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='opt';
    b.textContent=q.direction==='ko-en'?opt.word:opt.meaning;
    b.addEventListener('click',()=>answer(b,opt));
    $('options').appendChild(b);
  });
}

function answer(button,opt){
  if(answered) return;
  answered=true;
  const q=quiz[index];
  const correct=opt.word===q.item.word;
  if(correct){
    score++;
    button.classList.add('good');
    $('feedback').textContent='정답!';
  }else{
    button.classList.add('bad');
    wrong.push(q.item);
    $('feedback').textContent=`정답: ${q.item.word} — ${q.item.meaning}`;
  }
  [...$('options').children].forEach((b,idx)=>{
    b.disabled=true;
    const option=q.options[idx];
    if(option.word===q.item.word) b.classList.add('good');
  });
  $('scoreText').textContent=`점수 ${score}`;
  $('nextBtn').textContent=index===quiz.length-1?'결과 보기':'다음 문제';
  $('nextBtn').classList.remove('hidden');
}

function next(){
  if(!answered) return;
  index++;
  if(index>=quiz.length){ finish(); return; }
  renderQuestion();
}

function finish(){
  $('quizPanel').classList.add('hidden');
  $('resultPanel').classList.remove('hidden');
  $('finalScore').textContent=`${score} / ${quiz.length}`;
  const pct=Math.round(score/quiz.length*100);
  $('finalMsg').textContent = pct>=90?'거의 완벽해요.':pct>=75?'잘했어요. 틀린 단어만 다시 보면 돼요.':pct>=60?'조금만 더 복습하면 금방 올라가요.':'틀린 단어를 한 번 훑고 다시 풀어보세요.';
  $('wrongList').innerHTML='';
  if(wrong.length){
    $('wrongBox').classList.remove('hidden');
    wrong.forEach(x=>{
      const d=document.createElement('div');
      d.className='wrong-item';
      d.innerHTML=`<b>${escapeHtml(x.word)}</b> · ${escapeHtml(x.meaning)}`;
      $('wrongList').appendChild(d);
    });
  } else {
    $('wrongBox').classList.add('hidden');
  }
  $('bar').style.width='100%';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

$('startBtn').addEventListener('click',start);
$('nextBtn').addEventListener('click',next);
$('againBtn').addEventListener('click',start);
$('changeBtn').addEventListener('click',()=>{
  $('resultPanel').classList.add('hidden');
  $('quizPanel').classList.add('hidden');
  $('setupPanel').classList.remove('hidden');
});
</script>
